# =============================================================================
# ~210M NON-EMBEDDING baseline (adapted from your 124M-class config)
# Architecture changes vs. original:  n_layer 12->16, n_embd 768->1024, n_head 12->16, ffn_hidden 3072->4096
#   -> 205.6M non-embedding params, 308.6M total, head_dim=64, aspect ratio d/L=64 (canonical scaled-GPT-2)
# All widths kept multiple of 128 and head_dim fixed at 64 (Flash fast path + qk_norm stays 64).
# See accompanying notes for LR/batch/token-budget rationale and ablation knobs.
# =============================================================================
settings:
  experiment_id: ${modalities_env:experiment_id}
  config_file_path: ${modalities_env:config_file_path}
  referencing_keys:
    sample_key: input_ids
    target_key: target_ids
    prediction_key: logits
  cuda_env:
    local_rank: ${cuda_env:LOCAL_RANK}
    global_rank: ${cuda_env:RANK}
    world_size: ${cuda_env:WORLD_SIZE}
  paths:
    checkpoint_saving_path: /leonardo_scratch/large/userexternal/mfrey000/experiments_tests
    experiments_root_path: /leonardo_scratch/large/userexternal/mfrey000/experiments_tests
  intervals:
    training_log_interval_in_steps: 1
    checkpointing_interval_in_steps: 10000
    evaluation_interval_in_steps: 10000
  consistency_enforcement:
    enforce_tokens_per_step_consistency: true
    enforce_last_step_logged: false
    enforce_last_step_evaluated: false
    enforce_last_step_checkpointed: false
  step_profile:
    gradient_accumulation_steps: 1
    local_train_micro_batch_size: 8
    sequence_length: 4096
    #     16 GPUs -> mbs=4, gas=2
    #     32 GPUs -> mbs=4, gas=1
    #     64 GPUs -> mbs=2, gas=1
    #      1 GPU  -> mbs=2, gas=64
    dp_degree:
      instance_key: dp_degree
      pass_type: BY_REFERENCE
  training_target:
    # 20B tokens (~65x total params / ~97x non-embedding).
    num_target_tokens: 20971520000 # 40000 steps * 524288 tokens/step
    num_target_steps:
      component_key: number_conversion
      variant_key: num_steps_from_num_tokens
      config:
        dp_degree:
          instance_key: dp_degree
          pass_type: BY_REFERENCE
        local_micro_batch_size: ${settings.step_profile.local_train_micro_batch_size}
        global_num_tokens: ${settings.training_target.num_target_tokens}
        sequence_length: ${settings.step_profile.sequence_length}
        gradient_accumulation_steps: ${settings.step_profile.gradient_accumulation_steps}
  training_progress:
    global_num_seen_tokens: 0
    num_seen_steps: 0
    num_seen_samples: 0
    last_step: -1

collate_fn:
  component_key: collate_fn
  variant_key: gpt_2_llm_collator
  config:
    sample_key: ${settings.referencing_keys.sample_key}
    target_key: ${settings.referencing_keys.target_key}

