train_dataloader:
  component_key: data_loader
  variant_key: default
  config:
    num_workers: 2
    pin_memory: true
    dataloader_tag: train
    dataset:
      instance_key: train_dataset
      pass_type: BY_REFERENCE
    batch_sampler:
      component_key: batch_sampler
      variant_key: default
      config:
        batch_size: ${settings.step_profile.local_train_micro_batch_size}
        drop_last: true
        sampler:
          component_key: sampler
          variant_key: resumable_distributed_sampler
          config:
            dataset:
              instance_key: train_dataset
              pass_type: BY_REFERENCE
            rank: ${settings.cuda_env.global_rank}
            num_replicas: ${settings.cuda_env.world_size}
            shuffle: true
            seed: 42
            drop_last: true
            skip_num_global_samples: ${settings.training_progress.num_seen_samples}
    collate_fn:
      instance_key: collate_fn
      pass_type: BY_REFERENCE
eval_dataset:
  component_key: dataset
  variant_key: packed_mem_map_dataset_continuous
  config:
    raw_data_path: /leonardo_work/EUHPC_E05_119/mfrey/tokenized/score4.5+/part-00000.pbin
    sequence_length: ${settings.step_profile.sequence_length}
    sample_key: ${settings.referencing_keys.sample_key}
eval_dataloader:
  component_key: data_loader
  variant_key: default
  config:
    num_workers: 2
    pin_memory: true
    dataloader_tag: eval
    dataset:
      instance_key: eval_dataset
      pass_type: BY_REFERENCE
    batch_sampler:
      component_key: batch_sampler
      variant_key: default
      config:
        batch_size: 2
        drop_last: true
        sampler:
          component_key: sampler
          variant_key: distributed_sampler
          config:
            rank: ${settings.cuda_env.global_rank}
            num_replicas: ${settings.cuda_env.world_size}
            shuffle: false
            drop_last: true
            dataset:
              instance_key: eval_dataset
              pass_type: BY_REFERENCE
    collate_fn:
      instance_key: collate_fn
      pass_type: BY_REFERENCE
eval_dataloaders:
- instance_key: eval_dataloader
  pass_type: BY_REFERENCE

checkpoint_saving:
  component_key: checkpoint_saving
  variant_key: default
  config:
    checkpoint_saving_strategy:
      component_key: checkpoint_saving_strategy
      variant_key: save_k_most_recent_checkpoints_strategy
      config:
        k: -1
    checkpoint_saving_execution:
      component_key: checkpoint_saving_execution
      variant_key: dcp
      config:
        checkpoint_path: ${settings.paths.experiments_root_path}/${settings.experiment_id}
        global_rank: ${settings.cuda_env.global_rank}
        experiment_id: ${settings.experiment_id}

loss_fn:
  component_key: loss
  variant_key: clm_cross_entropy_loss
  config:
    target_key: ${settings.referencing_keys.target_key}
    prediction_key: ${settings.referencing_keys.prediction_key}

device_mesh:
  component_key: device_mesh
  variant_key: default
  config:
    device_type: cuda
    data_parallel_replicate_degree: 1
    data_parallel_shard_degree: -1
    world_size: ${settings.cuda_env.world_size}

dp_degree:
  component_key: number_conversion
  variant_key: parallel_degree
  config:
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE
    parallelism_methods: [dp_shard, dp_replicate]

app_state:
  component_key: app_state
  variant_key: raw
  config:
    model:
      instance_key: initialized_model
      pass_type: BY_REFERENCE
    optimizer:
      instance_key: optimizer
      pass_type: BY_REFERENCE
    lr_scheduler:
      instance_key: lr_scheduler
      pass_type: BY_REFERENCE

initialized_model:
  component_key: model
  variant_key: model_initialized
  config:
    model:
      instance_key: fsdp_model
      pass_type: BY_REFERENCE
    model_initializer:
      component_key: model_initialization
      variant_key: composed
      config:
        model_type: gpt2
        weight_init_type: scaled
        mean: 0.0
        std: 0.02
        num_layers: ${model_raw.config.n_layer}
        multi_device_generator_policy: error

fsdp_model:
  component_key: model
  variant_key: fsdp2_wrapped
  config:
    model:
      instance_key: compiled_model
      pass_type: BY_REFERENCE
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE
    mixed_precision_settings:
      param_dtype: BF_16
      reduce_dtype: BF_16
    block_names: [GPT2Block]

compiled_model:
  component_key: model
  variant_key: compiled
  config:
    model:
      instance_key: model_raw
      pass_type: BY_REFERENCE
    block_names: [GPT2Block]

model_raw:
  component_key: model
  variant_key: gpt2
  config:
    use_meta_device: false
    use_weight_tying: false
    sample_key: ${settings.referencing_keys.sample_key}
    poe_type: NOPE
    sequence_length: ${settings.step_profile.sequence_length}
    prediction_key: ${loss_fn.config.prediction_key}
    vocab_size: 50304
    # ---- ~210M NON-EMBEDDING shape ----
    n_layer: 16
    n_head_q: 16
    n_head_kv: 16
    ffn_hidden: 4096
    n_embd: 1024
    # ----------------------------------------------
    dropout: 0.0
    bias: false
    attention_config:
      qkv_transforms:
        - type_hint: RotaryTransform
          config:
            n_embd: ${model_raw.config.n_embd}
            n_head: ${model_raw.config.n_head_q}
            seq_length_dim: -2
            base_freq: 10000
      qk_norm_config:
        norm_type: pytorch_rms_norm
        config:
          normalized_shape: 64
          eps: 1.0e-05
    attention_implementation: pytorch_flash
    activation_type: swiglu
    attention_norm_config:
      norm_type: pytorch_rms_norm
      config:
        normalized_shape: 1024
        eps: 1.0e-05
    ffn_norm_config:
      norm_type: pytorch_rms_norm
      config:
        normalized_shape: 1024
        eps: 1.0e-05
    lm_head_norm_config:
      norm_type: pytorch_rms_norm
      config:
        normalized_shape: 1024
        eps: 1.0e-05

lr_scheduler:
  component_key: scheduler
  variant_key: onecycle_lr
  config:
    optimizer:
      instance_key: optimizer
      pass_type: BY_REFERENCE
    max_lr: 0.003
    div_factor: 10          # initial LR = max_lr/10 = 3.0e-4
    final_div_factor: 1     # final LR = initial = max_lr/10
    total_steps: ${settings.training_target.num_target_steps}
    pct_start: 0.01
    anneal_strategy: cos
    last_epoch: ${settings.training_progress.last_step}

optimizer:
  component_key: optimizer
  variant_key: adam_w
  config:
    lr: 0.0003             # overridden by OneCycle; set to max_lr/div_factor for consistency
    betas: [0.9, 0.95]
    eps: 1e-8
    weight_decay: 1e-1     # decoupled WD=0.1, standard (GPT-3/Llama/OLMo); also aids LR transfer across width
    weight_decay_groups_excluded: [embedding, pytorch_rms_norm]
    wrapped_model:
      instance_key: initialized_model
      pass_type: BY_REFERENCE

gradient_clipper:
  component_key: gradient_clipper
  variant_key: fsdp2
  config:
    wrapped_model:
      instance_key: initialized_model
      pass_type: BY_REFERENCE
    norm_type: P2_NORM
    max_norm: 1.0
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE

progress_subscriber:
  component_key: progress_subscriber
  variant_key: rich
  config:
    global_rank: ${settings.cuda_env.global_rank}
    num_seen_steps: ${settings.training_progress.num_seen_steps}
    num_target_steps: ${settings.training_target.num_target_steps}
    train_dataloader_tag: ${train_dataloader.config.dataloader_tag}
    eval_dataloaders:
      instance_key: eval_dataloaders
      pass_type: BY_REFERENCE

evaluation_subscriber:
  component_key: results_subscriber
  variant_key: wandb
  config:
    global_rank: ${settings.cuda_env.global_rank}
    project: tests
    mode: OFFLINE
    experiment_id: base_toadapt
    directory: ${settings.paths.experiments_root_path}/wandb
    config_file_path: ${settings.config_file_path}

mfu_calculator:
  component_key: mfu_calculator
  variant_key: gpt2
  config:
    n_layer: ${model_raw.config.n_layer}
    sequence_length: ${settings.step_profile.sequence_length}
    n_embd: ${model_raw.config.n_embd}
    world_size: ${settings.cuda_env.world_size}
    wrapped_model:
      instance_key: initialized_model
      pass_type: BY_REFERENCE
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE

tokenizer:
  component_key: tokenizer
  variant_key: pretrained_hf_tokenizer
  config:
    pretrained_model_name_or_path: /leonardo_work/EUHPC_D21_101/mfrey/tokenizer/local_gpt2_tokenizer/
    padding: false
    truncation: false

model_converter:
  component_key: model_converter
  variant_key: default
  config:
    command_template: "python src/modalities/conversion/gpt2/convert_gpt2.py {modalities_config} {output_dir} --checkpoint_path {checkpoint_path} > {checkpoint_path}/conversion.log 2>&1"
    checkpoint_dir: ${settings.paths.experiments_root_path}/${settings.experiment_id}
    global_rank: ${settings.cuda_env.global_rank}
    eval_interval: ${settings.intervals.checkpointing_interval_in_steps}

downstream_evaluator:
  component_key: downstream_evaluator
  variant_key: default
  config:
    tokenizer:
      instance_key: tokenizer
      pass_type: BY_REFERENCE
    tasks:
      - "minerva_math_algebra:bpb::olmes"
      - "minerva_math_counting_and_probability:bpb::olmes"
      - "minerva_math_geometry:bpb::olmes"
      - "minerva_math_intermediate_algebra:bpb::olmes"
      - "minerva_math_number_theory:bpb::olmes"
      - "minerva_math_prealgebra:bpb::olmes"
      - "minerva_math_precalculus:bpb::olmes"
      - "arc_challenge:rc::olmes:full"
      - "arc_easy:rc::olmes:full"
      - "hellaswag:rc::olmes:full"
      - "winogrande:rc::olmes:full"
      - "socialiqa:rc::olmes:full"
      - "piqa:rc::olmes:full"
      - "qasper_yesno:rc::olmes"
      - "lambada"
      - "arc_challenge:rc:bpb::olmes:full"
      - "arc_easy:rc:bpb::olmes:full"
      - "hellaswag:rc:bpb::olmes:full"
      - "winogrande:rc:bpb::olmes:full"
      - "socialiqa:rc:bpb::olmes:full"
      - "piqa:rc:bpb::olmes:full"
      - "qasper_yesno:rc:bpb::olmes"
      - "lambada:bpb"
      - "gsm8k::olmes"
    eval_interval: ${settings.intervals.evaluation_interval_in_steps}
    checkpoint_dir: ${settings.paths.experiments_root_path}/${settings.experiment_id}
    global_rank: ${settings.cuda_env.global_rank}
    olmes_command_template: "bash scripts/evaluation/run_olmes_sbatch.sh {hf_model_dir} '{tasks}' {step} 128 1"