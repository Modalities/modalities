# Nemotron-3 Nano real-data training config for 4x A100 80GB.
#
# This is the runnable-on-real-data counterpart to config_lorem_ipsum_nemotron_nano_fsdp2.yaml.
# Same architecture, but at production sequence length (4096) on a Llama-3 tokenized FineWeb slice,
# with the fused Mamba-2 kernels and a proper warmup + cosine schedule.
#
# ARCHITECTURE
# Full width of Nemotron-3 Nano 30B-A3B (arXiv:2512.20848) - model dimension 2688, 64 Mamba-2 heads
# of dim 64, 128 routed experts of dim 1856 with top-6 routing plus 2 shared experts, 32 query / 2 KV
# attention heads of head dim 128 - with depth cut from 52 to 16 layers to fit four GPUs. The layer
# pattern is the first 16 characters of the published pattern, preserving the Mamba / MoE / attention
# interleaving and ratio (7 : 7 : 2 here versus 23 : 23 : 6 in the full model).
#
# Hyperparameter values are adopted from the Megatron-Bridge recipe
# `src/megatron/bridge/recipes/nemotronh/h100/nemotron_3_nano.py`, Copyright (c) 2026,
# NVIDIA CORPORATION, licensed under the Apache License, Version 2.0.
#
# DATA
# Both files are byte-exact, provably disjoint slices of a document-shuffled FineWeb sample-10BT
# tokenized with the Llama-3 tokenizer (vocab 128256, 4 bytes per token):
#
#   role   file                                                tokens         source token range
#   train  ..._train-head-2B-tokens.pbin                       2,000,000,000  [0, 2e9)
#   eval   ..._eval-tail-2M-tokens.pbin                            2,000,000  [9,692,110,008, 9,694,110,008)
#
# The split is a head/tail cut rather than a random split so that disjointness is a property of the
# byte offsets and needs no bookkeeping. The source file is document-shuffled (seed 42), so the head
# is distributionally representative.
#
# A larger 20M-token slice (`..._eval-tail-20M-tokens.pbin`, 4,882 sequences) covering tokens
# [9,674,110,008, 9,694,110,008) is also available for a final evaluation. Both eval slices are tails
# of the same file, so the 2M slice is a *subset* of the 20M one - they are alternatives, not
# independent sets. The 2M slice is wired up here because a full pass over the 20M one is 610 eval
# steps; the 2M slice is 61. Both are disjoint from the training head.
#
# The 2B-token head is sized to what this hardware can actually consume, not to the full 9.69B-token
# sample. To train on the full sample instead, point `train_dataset_path` at the original
# `fineweb_sample-10BT-shuffled-seed_42-bs_100.pbin` - but note that it *contains* the eval tail, so
# either re-carve a head slice or switch to a held-out set from a different corpus.
#
# SIZE AND MEMORY (4x A100-SXM4-80GB, FSDP2 full shard, AdamW, bf16 params / fp32 reduce)
#
#   parameters         10.09B      (16 layers; the larger vocab adds 419M over the GPT-2 vocab variant)
#   active per token     1.57B      (includes the 690M embedding + untied lm_head)
#   global batch          32 sequences = 131,072 tokens  (4 ranks x 1 micro batch x 8 accum steps)
#   target steps       15,258       for one pass over the 2B-token head
#
#   peak memory        49.0 GiB / GPU   (measured, see VERIFICATION)
#
# Persistent optimizer state dominates that peak: fp32 shard + fp32 grad + two fp32 Adam moments is
# 16 bytes per parameter, sharded four ways, i.e. 37.6 GiB per GPU. The remaining ~11 GiB is the
# unsharded bf16 all-gather of the largest FSDP unit (one ~1.3B-parameter MoE layer, ~2.6 GiB) plus
# its prefetch, the checkpointed layer inputs (~350 MiB), and the vocabulary projection - 4096 x
# 128256 logits are ~1 GiB in bf16 and the cross-entropy upcasts them.
#
# For 40GB cards set `n_layer: 9` with `layer_pattern: "MEMEM*EME"`: 6.06B parameters, 22.6 GiB of
# persistent state, and a measured peak of 33.8 GiB.
#
# VERIFICATION
# Both variants were run end to end on the real data above (4x A100-SXM4-80GB):
#
#   variant   steps   initial loss   final loss   held-out loss        peak memory   exit
#   16 layer      6          11.95         8.99   8.99 at step 5       49.0 GiB      0
#    9 layer     40          11.94         6.96   7.38 at step 20      33.8 GiB      0
#
# The initial loss matching ln(128256) = 11.76 is the check that the vocabulary and the tokenization
# of the data agree - a mismatched vocab shows up here immediately. The held-out loss tracking the
# train loss at the same step (8.99 vs 8.99; 7.38 vs 7.35) is the check on the data split: a
# noticeably *lower* eval loss would indicate the eval slice leaking into training.
#
# Those two runs used this file's architecture, data, optimizer and parallelism unchanged. They
# differed only in run length: the token budget was capped to the step count shown, `warmup_steps`
# was scaled down to match, and checkpointing was disabled so that no 113 GiB write was triggered.
# The 9-layer row additionally used the reduced depth described above. Neither run is a substitute
# for a convergence run - they establish that the configuration is valid, fits, and learns.
#
# Run with:
#   torchrun --nnodes 1 --nproc_per_node 4 --rdzv-endpoint=0.0.0.0:29555 \
#     $(which modalities) run \
#     --config_file_path config_files/training/config_fineweb_nemotron_nano_fsdp2.yaml \
#     --experiments_root_path data/experiments
#
# Use one virtual environment for both `torchrun` and `modalities` - mixing them picks up a different
# torch build and the fused Mamba kernels will be missing.
#
# `ssd_backend: fused` requires the optional extra: `pip install -e '.[mamba]'`. The fused and native
# backends are numerically equivalent (verified to 1e-3 in tests/models/components/test_mamba2.py);
# switch to `native` if the kernels are unavailable, at a substantial throughput cost.
#
# NO THROUGHPUT NUMBER IS QUOTED HERE ON PURPOSE. The verification runs for this config shared their
# GPUs with an unrelated job at 100% utilization, so the samples/s and MFU they reported are measures
# of contention, not of this configuration. Measure on idle GPUs before using MFU to tune anything.

settings:
  experiment_id: ${modalities_env:experiment_id}
  config_file_path: ${modalities_env:config_file_path}
  referencing_keys:
    sample_key: input_ids
    target_key: target_ids
    prediction_key: logits
  cuda_env:
    local_rank: ${cuda_env:LOCAL_RANK}
    global_rank: ${cuda_env:RANK}
    world_size: ${cuda_env:WORLD_SIZE}
  paths:
    checkpoint_saving_path: data/checkpoints
    train_dataset_path: /raid/s3/opengptx/max_lue/repositories/training_datasets/processed/fineweb_sample-10BT-shuffled_train-head-2B-tokens.pbin
    test_dataset_path: /raid/s3/opengptx/max_lue/repositories/training_datasets/processed/fineweb_sample-10BT-shuffled_eval-tail-2M-tokens.pbin
    experiments_root_path: ${modalities_env:experiments_root_path}
  intervals:
    training_log_interval_in_steps: 10
    # A DCP checkpoint of this model is ~113 GiB (10.09B parameters plus fp32 Adam state, written by
    # all 4 ranks). Combined with `k: 1` below, at most ~226 GiB is on disk transiently while a new
    # checkpoint is written next to the retained one. Check free space before lowering this.
    checkpointing_interval_in_steps: 5000
    evaluation_interval_in_steps: 250
  consistency_enforcement:
    enforce_tokens_per_step_consistency: true
    enforce_last_step_logged: false
    enforce_last_step_evaluated: false
    enforce_last_step_checkpointed: false
  step_profile:
    # Gradient accumulation buys a sane global batch (32 sequences / 131k tokens) at micro batch 1,
    # which is what the ~40 GiB of resident optimizer state leaves room for at sequence length 4096.
    gradient_accumulation_steps: 8
    local_train_micro_batch_size: 1
    sequence_length: 4096
    dp_degree:
      instance_key: dp_degree
      pass_type: BY_REFERENCE
  training_target:
    num_target_tokens:
      component_key: number_conversion
      variant_key: num_tokens_from_packed_mem_map_dataset_continuous
      config:
        dataset_path: ${settings.paths.train_dataset_path}
        sequence_length: ${settings.step_profile.sequence_length}
        dp_degree:
          instance_key: dp_degree
          pass_type: BY_REFERENCE
        local_micro_batch_size: ${settings.step_profile.local_train_micro_batch_size}
        gradient_accumulation_steps: ${settings.step_profile.gradient_accumulation_steps}
    num_target_steps:
      component_key: number_conversion
      variant_key: num_steps_from_num_tokens
      config:
        dp_degree:
          instance_key: dp_degree
          pass_type: BY_REFERENCE
        local_micro_batch_size: ${settings.step_profile.local_train_micro_batch_size}
        global_num_tokens: ${settings.training_target.num_target_tokens}
        sequence_length: ${settings.step_profile.sequence_length}
        gradient_accumulation_steps: ${settings.step_profile.gradient_accumulation_steps}
  training_progress:
    global_num_seen_tokens: 0
    num_seen_steps: 0
    num_seen_samples: 0
    last_step: -1

collate_fn:
  component_key: collate_fn
  variant_key: gpt_2_llm_collator
  config:
    sample_key: ${settings.referencing_keys.sample_key}
    target_key: ${settings.referencing_keys.target_key}

train_dataset:
  component_key: dataset
  variant_key: packed_mem_map_dataset_continuous
  config:
    raw_data_path: ${settings.paths.train_dataset_path}
    sequence_length: ${settings.step_profile.sequence_length}
    sample_key: ${settings.referencing_keys.sample_key}
    # Pretraining: the last target token of a sample is the first input token of the next, so no
    # token is wasted at block boundaries.
    reuse_last_target: true

train_dataloader:
  component_key: data_loader
  variant_key: default
  config:
    num_workers: 2
    pin_memory: true
    dataloader_tag: train
    dataset:
      instance_key: train_dataset
      pass_type: BY_REFERENCE
    batch_sampler:
      component_key: batch_sampler
      variant_key: default
      config:
        batch_size: ${settings.step_profile.local_train_micro_batch_size}
        drop_last: true
        sampler:
          component_key: sampler
          variant_key: resumable_distributed_sampler
          config:
            dataset:
              instance_key: train_dataset
              pass_type: BY_REFERENCE
            rank: ${settings.cuda_env.global_rank}
            num_replicas: ${settings.cuda_env.world_size}
            shuffle: true
            seed: 42
            drop_last: true
            skip_num_global_samples: ${settings.training_progress.num_seen_samples}
    collate_fn:
      instance_key: collate_fn
      pass_type: BY_REFERENCE

test_dataset:
  component_key: dataset
  variant_key: packed_mem_map_dataset_continuous
  config:
    raw_data_path: ${settings.paths.test_dataset_path}
    sequence_length: ${settings.step_profile.sequence_length}
    sample_key: ${settings.referencing_keys.sample_key}
    reuse_last_target: true

test_dataloader:
  component_key: data_loader
  variant_key: default
  config:
    num_workers: 2
    pin_memory: true
    dataloader_tag: test
    dataset:
      instance_key: test_dataset
      pass_type: BY_REFERENCE
    batch_sampler:
      component_key: batch_sampler
      variant_key: default
      config:
        # Forward-only, so a larger batch than training fits. 488 eval sequences across 4 ranks at
        # batch size 2 is exactly 61 eval steps per pass.
        batch_size: 2
        drop_last: true
        sampler:
          component_key: sampler
          variant_key: distributed_sampler
          config:
            rank: ${settings.cuda_env.global_rank}
            num_replicas: ${settings.cuda_env.world_size}
            shuffle: false
            drop_last: true
            dataset:
              instance_key: test_dataset
              pass_type: BY_REFERENCE
    collate_fn:
      instance_key: collate_fn
      pass_type: BY_REFERENCE

eval_dataloaders:
  - instance_key: test_dataloader
    pass_type: BY_REFERENCE

checkpoint_saving:
  component_key: checkpoint_saving
  variant_key: default
  config:
    checkpoint_saving_strategy:
      component_key: checkpoint_saving_strategy
      variant_key: save_k_most_recent_checkpoints_strategy
      config:
        # Keep only the newest checkpoint - each is ~113 GiB. Rotation with the `dcp` execution is
        # fixed (see tests/checkpointing/test_dcp_checkpoint_deletion.py).
        k: 1
    checkpoint_saving_execution:
      component_key: checkpoint_saving_execution
      variant_key: dcp
      config:
        checkpoint_path: ${settings.paths.checkpoint_saving_path}
        global_rank: ${settings.cuda_env.global_rank}
        experiment_id: ${settings.experiment_id}

# Language modelling loss plus the MoE load-balancing penalty. The penalty is computed inside each
# MoE layer (coefficient 1e-4, per the model report) and summed by the model into `moe_aux_loss`.
# The *primary* balancing mechanism is the auxiliary-loss-free expert bias; see the optimizer.
loss_fn:
  component_key: loss
  variant_key: weighted_sum
  config:
    weights: [1.0, 1.0]
    losses:
      - component_key: loss
        variant_key: clm_cross_entropy_loss
        config:
          target_key: ${settings.referencing_keys.target_key}
          prediction_key: ${settings.referencing_keys.prediction_key}
      - component_key: loss
        variant_key: moe_aux_loss
        config:
          prediction_key: moe_aux_loss

device_mesh:
  component_key: device_mesh
  variant_key: default
  config:
    device_type: cuda
    data_parallel_replicate_degree: 1
    data_parallel_shard_degree: -1
    world_size: ${settings.cuda_env.world_size}

dp_degree:
  component_key: number_conversion
  variant_key: parallel_degree
  config:
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE
    parallelism_methods: [dp_shard, dp_replicate]

app_state:
  component_key: app_state
  variant_key: raw
  config:
    model:
      instance_key: initialized_model
      pass_type: BY_REFERENCE
    optimizer:
      instance_key: optimizer
      pass_type: BY_REFERENCE
    lr_scheduler:
      instance_key: lr_scheduler
      pass_type: BY_REFERENCE

initialized_model:
  component_key: model
  variant_key: model_initialized
  config:
    model:
      instance_key: fsdp_model
      pass_type: BY_REFERENCE
    model_initializer:
      component_key: model_initialization
      variant_key: composed
      config:
        model_type: nemotron
        weight_init_type: scaled
        mean: 0.0
        # "auto" resolves to sqrt(2 / (5 * n_embd)) = 0.0172, which is what the reference recipe
        # uses as init_method_std for this width.
        std: auto
        hidden_dim: ${model_raw.config.n_embd}
        num_layers: ${model_raw.config.n_layer}

fsdp_model:
  component_key: model
  variant_key: fsdp2_wrapped
  config:
    model:
      instance_key: activation_checkpointed_model
      pass_type: BY_REFERENCE
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE
    mixed_precision_settings:
      param_dtype: BF_16
      reduce_dtype: FP_32
    # One FSDP unit per layer, so only a single ~1.3B-parameter MoE block is unsharded at a time.
    layers_per_fsdp_unit: 1
    block_names: [Mamba2Layer, NemotronMoELayer, NemotronAttentionLayer, NemotronMLPLayer]

activation_checkpointed_model:
  component_key: model
  variant_key: activation_checkpointed
  config:
    model:
      instance_key: model_raw
      pass_type: BY_REFERENCE
    ac_variant: full_activation_checkpointing
    layers_fqn: transformer.h
    ac_fun_params: {}

model_raw:
  component_key: model
  variant_key: nemotron
  config:
    use_meta_device: true
    sample_key: ${settings.referencing_keys.sample_key}
    prediction_key: ${settings.referencing_keys.prediction_key}
    aux_loss_key: moe_aux_loss
    sequence_length: ${settings.step_profile.sequence_length}
    # Llama-3 tokenizer, matching the tokenization of the FineWeb slices above. Already a multiple
    # of 128 (128256 = 1002 * 128), so no padding is needed.
    vocab_size: 128256
    n_embd: 2688
    # Full Nemotron-3 Nano is 52 layers; trimmed to 16 to fit four GPUs. Keep this in sync with
    # the length of layer_pattern - the model validates it.
    n_layer: 16
    layer_pattern: "MEMEM*EMEMEM*EME"
    use_weight_tying: false
    lm_head_norm_config: &nemotron_norm_config
      norm_type: pytorch_rms_norm
      config:
        normalized_shape: ${model_raw.config.n_embd}
        eps: 1e-5
    layer_specs:
      "M":
        component_key: nemotron_layer_spec
        variant_key: mamba2
        config:
          n_embd: ${model_raw.config.n_embd}
          mamba_n_heads: 64
          mamba_head_dim: 64
          mamba_state_dim: 128
          mamba_n_groups: 8
          d_conv: 4
          # 4096 / 128 = 32 scan chunks.
          chunk_size: 128
          ssd_backend: fused
          norm_config: *nemotron_norm_config
      "E":
        component_key: nemotron_layer_spec
        variant_key: moe
        config:
          n_embd: ${model_raw.config.n_embd}
          num_experts: 128
          moe_ffn_hidden: 1856
          top_k: 6
          route_scale: 2.5
          score_function: sigmoid
          use_expert_bias: true
          router_dtype: float32
          num_shared_experts: 2
          shared_expert_ffn_hidden_per_expert: 1856   # -> one fused MLP of 3712 hidden units
          aux_loss_coeff: 1.0e-4
          experts_backend: grouped_mm
          norm_config: *nemotron_norm_config
      "*":
        component_key: nemotron_layer_spec
        variant_key: attention
        config:
          n_embd: ${model_raw.config.n_embd}
          n_head_q: 32
          n_head_kv: 2
          head_dim: 128
          attention_implementation: pytorch_flash
          norm_config: *nemotron_norm_config

# Warmup then cosine decay to 10% of peak, the standard LLM pretraining schedule and what the
# reference recipe uses. `warmup_steps` is absolute, so it must stay well below `total_steps`
# (~15,258 here); 750 is ~5% of the run. Re-tune it if you change the token budget or batch size.
lr_scheduler:
  component_key: scheduler
  variant_key: linear_warmup_cosine_annealing_lr
  config:
    optimizer:
      instance_key: optimizer
      pass_type: BY_REFERENCE
    warmup_steps: 750
    total_steps: ${settings.training_target.num_target_steps}
    initial_lr: 4.5e-5
    max_lr: 4.5e-4
    final_lr: 4.5e-5

# The `moe_load_balanced` decorator adds the auxiliary-loss-free expert bias update as an optimizer
# step pre-hook. Pinning it to the optimizer step (rather than the forward pass) is what makes it
# correct under gradient accumulation: token counts accumulate over micro-batches and are reduced
# across data-parallel ranks exactly once per step.
optimizer:
  component_key: optimizer
  variant_key: moe_load_balanced
  config:
    expert_bias_update_rate: 1.0e-3
    model:
      instance_key: initialized_model
      pass_type: BY_REFERENCE
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE
    optimizer:
      component_key: optimizer
      variant_key: adam_w
      config:
        lr: 4.5e-4
        betas: [0.9, 0.95]
        eps: 1e-8
        weight_decay: 0.1
        # The state space parameters (A_log, D, dt_bias, conv1d) parameterize the SSM dynamics and
        # the router gate decides expert assignment; decaying either destabilizes training.
        weight_decay_groups_excluded: [embedding, layernorm, ssm, router]
        wrapped_model:
          instance_key: initialized_model
          pass_type: BY_REFERENCE

gradient_clipper:
  component_key: gradient_clipper
  variant_key: fsdp2
  config:
    wrapped_model:
      instance_key: initialized_model
      pass_type: BY_REFERENCE
    norm_type: P2_NORM
    max_norm: 1.0
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE

progress_subscriber:
  component_key: progress_subscriber
  variant_key: rich
  config:
    global_rank: ${settings.cuda_env.global_rank}
    num_seen_steps: ${settings.training_progress.num_seen_steps}
    num_target_steps: ${settings.training_target.num_target_steps}
    train_dataloader_tag: ${train_dataloader.config.dataloader_tag}
    eval_dataloaders:
      instance_key: eval_dataloaders
      pass_type: BY_REFERENCE

evaluation_subscriber:
  component_key: results_subscriber
  variant_key: wandb
  config:
    global_rank: ${settings.cuda_env.global_rank}
    project: modalities_nemotron_fineweb
    mode: OFFLINE
    experiment_id: ${settings.experiment_id}
    directory: wandb_storage
    config_file_path: ${settings.config_file_path}

# num_active_params is derived from the model, so it stays correct if the layer pattern changes.
mfu_calculator:
  component_key: mfu_calculator
  variant_key: nemotron
  config:
    layer_pattern: ${model_raw.config.layer_pattern}
    sequence_length: ${settings.step_profile.sequence_length}
    n_embd: ${model_raw.config.n_embd}
    n_head_q: 32
    head_dim: 128
    world_size: ${settings.cuda_env.world_size}
    model_parts:
      instance_key: initialized_model
      pass_type: BY_REFERENCE
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE
