# Tokenizer and packing settings for the annealing blend.
#
# Used twice:
#   * `modalities quality calibrate --tokenizer_config <this file>` builds only the
#     `tokenizer` section, so the token estimates are measured with the same tokenizer
#     the packing will use. The `settings` below are ignored there.
#   * `modalities quality write-packing-configs --template <this file>` copies everything
#     except `src_path`, `index_path` and `dst_path`, which it fills in per source file.
#
# Set the tokenizer to whatever the run actually trains with. Getting this wrong does not
# fail loudly -- it produces a plausible token budget for the wrong tokenizer.

settings:
  # Placeholders. `write-packing-configs` replaces all three per source file; they only
  # need to point at something real so the config validates on its own.
  src_path: /data/annealing/english/Finewiki/000_00000.jsonl
  index_path: null
  dst_path: /data/user/richard.rutmann/annealing_blend/placeholder.pbin
  jq_pattern: .text
  num_cpus: ${node_env:num_cpus}
  eod_token: <|endoftext|>
  processing_batch_size: 1000
  raw_samples_queue_size: 100
  processed_samples_queue_size: 100

tokenizer:
  component_key: tokenizer
  variant_key: pretrained_hf_tokenizer
  config:
    # The tokenizer the long-context pipeline uses. The token audit under
    # /data/michael.fromm used the Super-120B variant instead -- confirm which this run
    # trains with before trusting any token figure.
    pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
    padding: false
    truncation: false
