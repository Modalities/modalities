settings:
  cuda_env:
    local_rank: ${cuda_env:LOCAL_RANK}

loss_fn:
  component_key: loss
  variant_key: clm_cross_entropy_loss
  config:
    target_key: target_ids
    prediction_key: logits

device_mesh:
  component_key: device_mesh
  variant_key: default
  config:
    device_type: cuda
    context_parallel_degree: 2
    pipeline_parallel_degree: 2
    data_parallel_shard_degree: 1
    data_parallel_replicate_degree: 1
    world_size: 4

scheduled_pipeline:
  component_key: pipeline
  variant_key: scheduled
  config:
    loss_fn:
      instance_key: loss_fn
      pass_type: BY_REFERENCE
    pp_schedule_name: gpipe
    batch_size: 2
    microbatch_size: 1
    pp_degree: ${device_mesh.config.pipeline_parallel_degree}
    pipeline:
      component_key: pipeline
      variant_key: builder
      config:
        pp_stage:
          component_key: pipeline
          variant_key: selector
          config:
            pipeline:
              instance_key: staged_pipeline
              pass_type: BY_REFERENCE
            selection_type: PP_STAGE
        model_part:
          instance_key: fsdp_model
          pass_type: BY_REFERENCE

fsdp_model:
  component_key: model
  variant_key: fsdp2_wrapped
  config:
    model:
      instance_key: gpt2_cp_model
      pass_type: BY_REFERENCE
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE
    mixed_precision_settings:
      param_dtype: FP_32
      reduce_dtype: FP_32
    block_names: [GPT2Block]

gpt2_cp_model:
  component_key: model
  variant_key: gpt2_cp
  config:
    model:
      instance_key: model_part
      pass_type: BY_REFERENCE
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE
    context_parallel_load_balancer: headtail

model_part:
  component_key: pipeline
  variant_key: selector
  config:
    pipeline:
      instance_key: staged_pipeline
      pass_type: BY_REFERENCE
    selection_type: MODEL_PART

# Use the already-initialized full model as the source for staging so that
# all ranks share the same initial weights (same as the FSDP2 baseline).
staged_pipeline:
  component_key: pipeline
  variant_key: staged
  config:
    whole_model:
      instance_key: initialized_model
      pass_type: BY_REFERENCE
    stages_generator:
      component_key: stages_generator
      variant_key: gpt2_stages_generator
      config:
        num_model_layers: ${model_raw.config.n_layer}
        input_layer_equivalence: 1
        output_layer_equivalence: 1
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE
    local_rank: ${settings.cuda_env.local_rank}
    pp_schedule_name: ${scheduled_pipeline.config.pp_schedule_name}
    num_layers_per_stage: 2

initialized_model:
  component_key: model
  variant_key: model_initialized
  config:
    model:
      instance_key: model_raw
      pass_type: BY_REFERENCE
    model_initializer:
      component_key: model_initialization
      variant_key: composed
      config:
        model_type: gpt2
        weight_init_type: scaled
        mean: 0.0
        std: 0.02
        num_layers: ${model_raw.config.n_layer}

model_raw:
  component_key: model
  variant_key: gpt2
  config:
    use_meta_device: true
    use_weight_tying: false
    sample_key: input_ids
    poe_type: NOPE
    sequence_length: 128
    prediction_key: logits
    vocab_size: 50304
    n_layer: 2
    n_head_q: 4
    n_head_kv: 2
    ffn_hidden: 128
    n_embd: 128
    dropout: 0.0
    bias: false
    # No RoPE: position_ids do not flow through PP inter-stage activation transfers.
    attention_config:
      qkv_transforms: []
    attention_implementation: pytorch_flash
    activation_type: swiglu
    attention_norm_config:
      norm_type: layer_norm
      config:
        normalized_shape: ${model_raw.config.n_embd}
        eps: 1e-5
    ffn_norm_config:
      norm_type: layer_norm
      config:
        normalized_shape: ${model_raw.config.n_embd}
        eps: 1e-5
    lm_head_norm_config:
      norm_type: layer_norm
      config:
        normalized_shape: ${model_raw.config.n_embd}
        eps: 1e-5
