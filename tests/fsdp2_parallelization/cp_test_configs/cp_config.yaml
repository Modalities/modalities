model:
  component_key: model
  variant_key: fsdp2_wrapped
  config:
    model:
      instance_key: gpt2_cp_model
      pass_type: BY_REFERENCE
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE
    mixed_precision_settings:
      param_dtype: FP_32
      reduce_dtype: FP_32
    block_names: [GPT2Block]

gpt2_cp_model:
  component_key: model
  variant_key: gpt2_cp
  config:
    model:
      instance_key: initialized_model
      pass_type: BY_REFERENCE
    device_mesh:
      instance_key: device_mesh
      pass_type: BY_REFERENCE
    context_parallel_load_balancer: headtail

initialized_model:
  component_key: model
  variant_key: model_initialized
  config:
    model:
      instance_key: model_raw
      pass_type: BY_REFERENCE
    model_initializer:
      component_key: model_initialization
      variant_key: composed
      config:
        model_type: gpt2
        weight_init_type: scaled
        mean: 0.0
        std: 0.02
        num_layers: ${model_raw.config.n_layer}

model_raw:
  component_key: model
  variant_key: gpt2
  config:
    use_meta_device: false
    use_weight_tying: false
    sample_key: input_ids
    poe_type: NOPE
    sequence_length: 128
    prediction_key: logits
    vocab_size: 50304
    n_layer: 2
    n_head_q: 4
    n_head_kv: 2
    ffn_hidden: 128
    n_embd: 128
    dropout: 0.0
    bias: false
    attention_config:
      qkv_transforms:
        - type_hint: RotaryTransform
          config:
            n_embd: ${model_raw.config.n_embd}
            n_head: ${model_raw.config.n_head_q}
            seq_length_dim: -2
            base_freq: 10000
    attention_implementation: pytorch_flash
    activation_type: swiglu
    attention_norm_config:
      norm_type: layer_norm
      config:
        normalized_shape: ${model_raw.config.n_embd}
        eps: 1e-5
    ffn_norm_config:
      norm_type: layer_norm
      config:
        normalized_shape: ${model_raw.config.n_embd}
        eps: 1e-5
    lm_head_norm_config:
      norm_type: layer_norm
      config:
        normalized_shape: ${model_raw.config.n_embd}
        eps: 1e-5

device_mesh:
  component_key: device_mesh
  variant_key: default
  config:
    device_type: cuda
    data_parallel_replicate_degree: 1
    data_parallel_shard_degree: 1
    context_parallel_degree: 2
    tensor_parallel_degree: 1
    world_size: 2
