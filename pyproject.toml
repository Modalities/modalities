[project]
name = "modalities"
version = "0.5.0"
requires-python = ">=3.10,<3.14"
description = "Modalities, a PyTorch-native framework for distributed and reproducible foundation model training."
readme = "README.md"
dependencies = [
    "numpy",
    "ninja",
    "packaging",
    "tqdm",
    "pyyaml",
    "transformers>=4.57.4,<5.0.0",
    "datasets",
    "protobuf",
    "SentencePiece",
    "rich",
    "omegaconf",
    "pydantic",
    "click",
    "click_pathlib",
    "jq",
    "class_resolver",
    "matplotlib",
    "wandb",
    "einops>=0.7.0",
    "debugpy",  # For VSCode debugging support
]

[project.urls]
Homepage = "https://github.com/Modalities/modalities"
Issues = "https://github.com/Modalities/modalities/issues"

[project.scripts]
modalities = "modalities.__main__:main"

[build-system]
requires = ["setuptools >= 61.0.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
linting = ["pre-commit"]
tests = ["pytest", "pytest-cov", "debugpy"]

# Fused Mamba-2 kernels. Optional: the hybrid Mamba-Transformer models ship a pure-PyTorch
# state space scan (ssd_backend="native") that runs everywhere. Install this extra to use
# ssd_backend="fused", which is numerically verified against the native backend. Note that the
# end-to-end throughput benefit is configuration dependent and was NOT observed at short sequence
# lengths (see docs/components/nemotron.md). Requires a CUDA toolchain to build.
#
# Both packages compile CUDA extensions and must be built against the torch already installed in
# the environment, so install them with --no-build-isolation --no-deps; letting the resolver see
# them can otherwise replace torch. causal-conv1d is pinned to a git tag because its PyPI sdist
# ships without its csrc/*.cpp sources and therefore cannot be built ("ninja: error: ... missing
# and no known rule to make it"). Verified on Python 3.13 / torch 2.9.1+cu128 / CUDA 12.8:
#
#   uv pip install --no-build-isolation --no-deps mamba-ssm==2.2.5
#   uv pip install --no-build-isolation --no-deps \
#     "causal-conv1d @ git+https://github.com/Dao-AILab/causal-conv1d.git@v1.5.0.post8"
#
# Setting TORCH_CUDA_ARCH_LIST to just your target architecture (e.g. "8.0" for A100) shortens the
# causal-conv1d build considerably; mamba-ssm hardcodes its own architecture list and ignores it.
mamba = [
  "mamba-ssm>=2.2.0; platform_system != 'Darwin'",
  "causal-conv1d>=1.4.0; platform_system != 'Darwin'",
]

cpu = ["torch>=2.10,<2.11.0", "torchvision"]
cu126 = [
  "torch>=2.10,<2.11.0",
  "torchvision",
  "flash-attn==2.8.3; platform_system != 'Darwin' and platform_machine != 'aarch64'"
]
cu128 = [
  "torch>=2.10,<2.11.0",
  "torchvision",
  "flash-attn==2.8.3; platform_system != 'Darwin' and platform_machine != 'aarch64'"
]
cu130 = [
  "torch>=2.10,<2.11.0",
  "torchvision",
  "flash-attn==2.8.3; platform_system != 'Darwin' and platform_machine != 'aarch64'"
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu126" },
    { extra = "cu128" },
    { extra = "cu130" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


[tool.uv.extra-build-dependencies]
flash-attn = [
    { requirement = "torch", match-runtime = true },
    { requirement = "ninja", match-runtime = true },
]

[tool.black]
target-version = ["py310"]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report term --cov-report html"
#addopts = "-ra" # Enable this instead of line above for reliable VS Code test debugging (without coverage)

[tool.coverage.run]
branch = true
omit = ["*/src/modalities/dataloader/open_gptx_dataset/*"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]


ignore_errors = true

[tool.coverage.html]
directory = "coverage_html_report"